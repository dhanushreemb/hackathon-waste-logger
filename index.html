<!DOCTYPE html>
<html>
<head>
    <title>Daily Waste Logger</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background: #f2f7f2;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 100px;
            font-size: 18px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Daily Waste Logger</h1>

        <p>How much food was wasted today?</p>

        <input type="number" id="waste" placeholder="kg">

        <br>

        <button onclick="logWaste()">Log Waste</button>

        <div id="result"></div>

    </div>

    <script>
        function logWaste() {

            let waste = document.getElementById("waste").value;

            if (waste === "") {
                document.getElementById("result").innerHTML =
                    "Please enter the waste amount.";
                return;
            }

            document.getElementById("result").innerHTML =
                "Today's recorded food waste: " + waste + " kg";
        }
    </script>

</body>
</html>
